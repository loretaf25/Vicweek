*{box-sizing:border-box;font-family:'Arial Narrow','Roboto Condensed','Helvetica Neue',Arial,sans-serif}
body{font-size:15px;letter-spacing:.01em}
body{margin:0;background-color:var(--bg-col,#f6f1e7);background-image:var(--bg-img);background-size:cover;background-position:center;background-attachment:fixed;color:var(--txt);display:flex;min-height:100vh}
aside{width:272px;background:var(--side);backdrop-filter:blur(6px);color:#8a6f66;border-right:1px solid #f8dcd6;padding:26px 16px;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;gap:8px;z-index:50}
.logo{display:flex;align-items:center;gap:12px;padding:4px 10px 24px;color:var(--txt);font-weight:600}
.wk-logo{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:2rem;line-height:1;letter-spacing:.04em}
.logo small{display:block;font-weight:500;font-size:.68rem;color:#b49a90}
.nav{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;border:none;background:none;color:inherit;font-size:1.05rem;font-weight:600;cursor:pointer;text-align:left;width:100%}
.nav:hover{background:color-mix(in srgb,var(--pri) 14%,#fff)}.nav.on{background:var(--pri);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--pri) 35%,transparent)}
.nav .ic{display:flex;width:22px;height:22px}.nav .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav .n{margin-left:auto;background:#f08a8a;color:#fff;font-size:.7rem;padding:2px 7px;border-radius:99px}
main{margin-left:272px;flex:1;padding:22px;max-width:1200px;min-width:0}
h1{margin:0;font-size:1.6rem;font-weight:600;letter-spacing:.04em}
h1.wk{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:4rem;letter-spacing:.04em;line-height:1;color:#5b4540}
.wk-box{text-align:center;margin:4px 0 18px}h2{margin:0 0 10px;font-size:1.05rem;font-weight:600}
.sub{margin:4px 0 0;color:var(--muted);font-size:.85rem}
.head{margin-bottom:16px}
.card{background:rgba(255,255,255,.93);border-radius:20px;box-shadow:0 4px 18px rgba(170,110,90,.09);padding:18px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{padding:8px 14px;border-radius:8px;font-weight:600;font-size:.85rem;border:1px solid var(--bdr);background:var(--surf);color:var(--txt);cursor:pointer}
.btn:hover{background:#fff5f0;border-color:#efd5c8}
.btn-p{background:var(--pri);color:#fff;border-color:var(--pri)}.btn-p:hover{background:#cf5c77}
.del{background:#ffe6e6;color:#d95f5f;border:none;border-radius:6px;padding:7px 10px;cursor:pointer;font-size:.8rem;font-weight:600}
.inp{padding:9px 10px;border:1px solid #efdfd5;border-radius:10px;font-size:.88rem;background:#fff;color:var(--txt);min-width:0}
.chip{padding:6px 13px;border-radius:99px;color:var(--txt);font-weight:600;background:#f6ece5;border-left:0;font-size:.82rem;border:none;cursor:pointer}
.chip:not(.off){background:#ecd9cd}
.chip.off{background:#f6ece5!important;color:#9a857d}
.today{background:color-mix(in srgb,var(--pri) 11%,#fff);color:var(--txt);border-radius:20px;padding:14px 16px;margin-bottom:14px}
.today b{font-size:1.05rem}.today .chip{background:rgba(255,255,255,.65);cursor:default}
.tw{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:6px;min-width:720px;table-layout:fixed}
th,td{border:none;padding:5px;text-align:center;height:92px;vertical-align:middle}
th{border-radius:14px;background:#f4e6db;color:#7a5f55;font-weight:600;letter-spacing:.04em;height:42px;font-size:.88rem}
th.th-t{width:105px}
th.hoy{background:var(--pri);color:#fff;font-size:1rem}
td.td-t{border-radius:14px;background:#fdf3ec;font-weight:700;color:#8a6f66;font-size:.8rem}
td{border-radius:16px;background:#fffaf7}td.hoy{background:color-mix(in srgb,var(--pri) 9%,#fff)}
.blk{width:100%;height:100%;border-radius:14px;padding:8px 6px;min-height:76px;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;transition:.15s}
.blk b{font-size:.84rem;line-height:1.2;max-width:100%;overflow-wrap:anywhere;hyphens:auto}.blk small{font-size:.72rem;opacity:.92;margin-top:2px;max-width:100%;overflow-wrap:anywhere}
.blk .bdg{margin-top:4px;background:rgba(255,255,255,.6);font-size:.7rem;padding:2px 8px;border-radius:99px;font-weight:600}
.blk.dim{opacity:.82;filter:saturate(.85)}
.blk.dim:hover{opacity:1;filter:none}
.blk.hoy{box-shadow:0 0 0 2px currentColor,0 4px 10px rgba(120,80,60,.14)}
.t-it{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid #f6ece5}
.t-it.done .tt{text-decoration:line-through;color:#94a3b8}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex-shrink:0}
.cgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:6px 0;max-width:300px}
.sw{height:28px;border-radius:6px;cursor:pointer;border:3px solid transparent}.sw.sel{border-color:#4a3b36}
.ch{border-left:3px solid;padding-left:14px}
.ev{display:grid;grid-template-columns:1fr 80px 80px 34px;gap:6px;margin-bottom:6px;align-items:center}
.ev .inp{width:100%}
.avg{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px;padding:10px 12px;background:#fdf3ec;border-radius:14px}
.avg b{font-size:1.5rem}
.warn{color:var(--muted);font-size:.8rem}
.empty{text-align:center;color:var(--muted);padding:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cdh{text-align:center;font-size:.75rem;font-weight:700;color:var(--muted);padding:4px 0}
.cd{min-height:96px;background:#fff;border:1px solid var(--bdr);border-radius:14px;padding:6px;cursor:pointer;overflow:hidden}
.cd:hover{background:#fff8f5}.cd.out{visibility:hidden}
.cd.hoy{border-color:var(--pri)}.cd.hoy .num{color:var(--pri)}
.cd.sel{background:color-mix(in srgb,var(--pri) 10%,#fff);box-shadow:0 0 0 2px var(--pri)}
.num{font-size:.8rem;font-weight:700;color:var(--muted)}
.ct{font-size:.66rem;border-radius:5px;padding:2px 6px;border-left:3px solid;background:#fbf3ee;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#4a3b36}
.ct.d{text-decoration:line-through;opacity:.5}
.more{font-size:.64rem;color:var(--muted);margin-top:2px}
@media(max-width:760px){
 .cd{min-height:54px;padding:4px}.ct{font-size:0;height:7px;width:7px;padding:0;display:inline-block;border-radius:50%;margin:3px 1px 0;background:var(--muted)}.more{display:none}
 .nav .ic,.nav .ic svg{width:20px;height:20px}h1.wk{font-size:3rem}table{border-spacing:4px}
 aside{top:auto;width:100%;flex-direction:row;padding:6px;gap:2px;justify-content:space-around}
 .logo{display:none}.nav{flex-direction:column;gap:2px;padding:6px 4px;font-size:.7rem;text-align:center;justify-content:center;position:relative}
 .nav .n{position:absolute;top:2px;right:14%;margin:0}
 main{margin-left:0;padding:calc(14px + env(safe-area-inset-top)) 12px calc(84px + env(safe-area-inset-bottom))}
 aside{padding-bottom:calc(6px + env(safe-area-inset-bottom))}
 .ev{grid-template-columns:1fr 64px 64px 34px}
}
</style>
</head>

<main id="main"></main>

/* ---------- Calendario ---------- */
var calM=new Date();calM.setDate(1);var calSel=null;

function vCal(m){

 m.appendChild(h('div',{class:'row',style:'justify-content:space-between;margin-bottom:12px'},[
  h('div',{class:'row'},[h('button',{class:'btn',onclick:function(){calM=new Date(y,mo-1,1);render();}},['‹']),
   h('b',{style:'font-size:1.1rem;text-transform:capitalize;min-width:150px;text-align:center'},[title]),
   h('button',{class:'btn',onclick:function(){calM=new Date(y,mo+1,1);render();}},['›'])]),
  h('button',{class:'btn',onclick:function(){calM=new Date();calM.setDate(1);calSel=todayS;render();}},['Hoy'])]));
 var g=h('div',{class:'cal'},['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(function(d){return h('div',{class:'cdh'},[d]);}));
 var first=(new Date(y,mo,1).getDay()+6)%7,n=new Date(y,mo+1,0).getDate();
 for(var i=0;i<first;i++)g.appendChild(h('div',{class:'cd out'}));
 for(var d=1;d<=n;d++)(function(d){
  var k=ds(new Date(y,mo,d)),ts=tasksOn(k),kids=[h('span',{class:'num'},[String(d)])];
  ts.slice(0,3).forEach(function(x){kids.push(h('div',{class:'ct'+(x.t.done?' d':''),style:'border-color:'+x.c.color,title:x.c.name},[x.t.text]));});
  if(ts.length>3)kids.push(h('div',{class:'more'},['+'+(ts.length-3)+' más']));
  g.appendChild(h('div',{class:'cd'+(k===todayS?' hoy':'')+(k===calSel?' sel':''),onclick:function(){calSel=k;render();}},kids));})(d);

 var p=calSel.split('-'),lab=new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});

  h('button',{class:'del',onclick:function(){var a=st.tasks[x.c.id];a.splice(a.indexOf(x.t),1);save();}},['Borrar'])]));});

/* ---------- Notas ---------- */
function calc(cid){var l=st.notes[cid]||[],s=0,w=0,tw=0;
 l.forEach(function(e){var wt=parseFloat(e.weight)||0;tw+=wt;if(e.grade!==''&&e.grade!==null&&!isNaN(parseFloat(e.grade))){s+=parseFloat(e.grade)*wt;w+=wt;}});
 return{avg:w?s/w:null,tw:tw,w:w};}
function vNotas(m){
 var mx=st.maxGrade;
 m.appendChild(head('Notas','Agrega evaluaciones por curso con su porcentaje y obtén tu promedio ponderado (escala 0–'+mx+').'));
 if(!st.courses.length)m.appendChild(h('div',{class:'card empty'},['Primero crea tus cursos en Configuración.']));
 st.courses.forEach(function(c){
  var list=st.notes[c.id]=st.notes[c.id]||[],r=calc(c.id);
  var card=h('div',{class:'card ch',style:'border-color:'+c.color},[h('h2',{},[c.name])]);
  if(list.length)card.appendChild(h('div',{class:'ev sub',style:'margin-bottom:2px'},[h('span',{},['Evaluación']),h('span',{},['Nota']),h('span',{},['Peso %']),h('span')]));
  list.forEach(function(e,i){
   card.appendChild(h('div',{class:'ev'},[
    h('input',{class:'inp',value:e.name,onchange:function(x){e.name=x.target.value;save();}}),
    h('input',{class:'inp',type:'number',min:0,max:mx,step:'0.01',placeholder:'—',value:e.grade,onchange:function(x){e.grade=x.target.value;save();}}),
    h('input',{class:'inp',type:'number',min:0,max:100,step:'any',value:e.weight,onchange:function(x){e.weight=x.target.value;save();}}),
    h('button',{class:'del',onclick:function(){list.splice(i,1);save();}},['✕'])]));});
  var nIn=h('input',{class:'inp',type:'number',min:1,max:20,placeholder:'N°',style:'width:70px'});
  card.appendChild(h('div',{class:'row',style:'margin-top:8px'},[
   h('button',{class:'btn',onclick:function(){list.push({name:'Evaluación '+(list.length+1),grade:'',weight:''});save();}},['+ Añadir evaluación']),
   nIn,h('button',{class:'btn',onclick:function(){var n=parseInt(nIn.value,10);if(!n||n<1)return;
     if(list.length&&!confirm('Esto reemplazará las evaluaciones actuales de '+c.name+'. ¿Continuar?'))return;
     var w=Math.round(10000/n)/100;st.notes[c.id]=[];for(var k=1;k<=n;k++)st.notes[c.id].push({name:'Evaluación '+k,grade:'',weight:w});save();},title:'Crea N evaluaciones con el mismo peso'},['Crear con pesos iguales'])]));
  var good=r.avg!==null&&r.avg>=mx*0.55;

   h('div',{style:'text-align:right'},[h('div',{class:'sub'},['Peso total: '+(Math.round(r.tw*100)/100)+'% · Calificado: '+(Math.round(r.w*100)/100)+'%']),
    list.length&&Math.abs(r.tw-100)>0.01?h('div',{class:'warn'},['Los pesos no suman 100%']):null])]));
  m.appendChild(card);});
}

 var D=days(),thr=h('tr',{},[h('th',{class:'th-t'},['Hora'])]);D.forEach(function(d){thr.appendChild(h('th',{},[d]));});

  h('div',{class:'tw'},[h('table',{style:'min-width:640px'},[h('thead',{},[thr]),tb])])]));
 // Horas y días
 var pc=h('div',{class:'card'},[h('h2',{},['⏰ Horas y días']),
  h('label',{class:'row',style:'margin-bottom:10px;font-weight:600'},[h('input',{type:'checkbox',checked:st.includeSaturday,onchange:function(e){st.includeSaturday=e.target.checked;save();}}),'Incluir sábado'])]);
 st.periods.forEach(function(p,idx){
  pc.appendChild(h('div',{class:'row',style:'margin-bottom:6px'},[
   h('input',{class:'inp',style:'flex:1',value:p,onchange:function(e){st.periods[idx]=e.target.value;save();}}),
   h('button',{class:'del',onclick:function(){st.periods.splice(idx,1);var ns={};
    Object.keys(st.schedule).forEach(function(k){var a=k.split('-'),pi=+a[0];if(pi<idx)ns[k]=st.schedule[k];else if(pi>idx)ns[(pi-1)+'-'+a[1]]=st.schedule[k];});st.schedule=ns;save();}},['Borrar'])]));});
 var pIn=h('input',{class:'inp',style:'flex:1',placeholder:'Nuevo bloque (ej. 16:00 - 18:00)'});
 pc.appendChild(h('div',{class:'row'},[pIn,h('button',{class:'btn btn-p',onclick:function(){if(pIn.value.trim()){st.periods.push(pIn.value.trim());save();}}},['+ Añadir'])]));
 m.appendChild(pc);
 // Cursos
 var ed=editId?getC(editId):null,nm=h('input',{class:'inp',placeholder:'Nombre del curso',value:ed?ed.name:''}),rm=h('input',{class:'inp',placeholder:'Aula o profesor (opcional)',value:ed?ed.room||'':''});
 var grid=h('div',{class:'cgrid'});
 PAL.forEach(function(col){var sw=h('div',{class:'sw'+(col===selCol?' sel':''),style:'background:'+col});
  sw.addEventListener('click',function(){selCol=col;[].forEach.call(grid.children,function(g){g.classList.remove('sel');});sw.classList.add('sel');});grid.appendChild(sw);});
 function saveC(){var n=nm.value.trim();if(!n)return;
  if(ed){ed.name=n;ed.room=rm.value.trim();ed.color=selCol;}else st.courses.push({id:'c_'+Date.now(),name:n,room:rm.value.trim(),color:selCol});
  editId=null;selCol=PAL[st.courses.length%PAL.length];save();}
 var cc=h('div',{class:'card'},[h('h2',{},['Mis cursos']),
  h('div',{style:'display:flex;flex-direction:column;gap:8px;background:#fdf3ec;padding:12px;border-radius:10px;margin-bottom:12px'},[
   h('b',{style:'font-size:.9rem'},[ed?'Editar curso: '+ed.name:'Añadir nuevo curso']),nm,rm,grid,
   h('div',{class:'row'},[h('button',{class:'btn btn-p',onclick:saveC},['Guardar curso']),ed?h('button',{class:'btn',onclick:function(){editId=null;render();}},['Cancelar']):null])])]);
 st.courses.forEach(function(c){
  cc.appendChild(h('div',{class:'t-it',style:'justify-content:space-between'},[
   h('div',{class:'row'},[h('span',{class:'dot',style:'background:'+c.color}),h('div',{},[h('b',{},[c.name]),h('div',{class:'sub',style:'margin:0'},[c.room||'Sin aula asignada'])])]),
   h('div',{class:'row'},[h('button',{class:'btn',onclick:function(){editId=c.id;selCol=c.color;render();window.scrollTo(0,document.body.scrollHeight);}},['Editar']),
    h('button',{class:'del',onclick:function(){if(!confirm('¿Borrar '+c.name+' y sus notas/tareas?'))return;
     st.courses=st.courses.filter(function(x){return x.id!==c.id;});Object.keys(st.schedule).forEach(function(k){if(st.schedule[k]===c.id)delete st.schedule[k];});delete st.tasks[c.id];delete st.notes[c.id];save();}},['Borrar'])])]));});
 m.appendChild(cc);
 // Preferencias
 m.appendChild(h('div',{class:'card'},[h('h2',{},['Notas']),
  h('label',{class:'row',style:'font-weight:600'},['Nota máxima de tu escala:',h('input',{class:'inp',type:'number',min:1,value:st.maxGrade,style:'width:80px',onchange:function(e){st.maxGrade=parseFloat(e.target.value)||20;save();}})])]));
}

function render(){
 applyTheme();renderSide();var m=document.getElementById('main');m.innerHTML='';
 ({horario:vHorario,tareas:vTareas,calendario:vCal,notas:vNotas,config:vConfig})[view](m);
}
render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){});}
})();
